- Suregon wil begin by creating a 4cm long by 3cm wide horizontal incision beginning at the location of
  palpation and extending medially. The surgeon will then place the  6cm mesh preperitoneal on the adominal
  wall and anchor with 3-4 interrupted sutures where desired. The surgeon will finish by closing the peritoneum
  with their preferred technique.
- Surgeon creates a 2cm long by 1.5 cm wide incision 15cm inferior to umbilicus at location of assistant
  palpation. The surgeon wil then suture the mesh to the wall using their prefered technique. The surgeon
  will then close the incision with their choice of suture technique.
